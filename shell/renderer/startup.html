<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src http://127.0.0.1:*">
  <title>Futures-AI · 启动</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(145deg,#1b1c1f,#0f1012); color: #e8e6e0; font: 16px/1.7 "Segoe UI",sans-serif; }
    main { width: min(640px,80vw); padding: 32px; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; background: rgba(255,255,255,.035); }
    h1 { font-size: 22px; } p { white-space: pre-wrap; overflow-wrap: anywhere; }
    .muted { color: #9a9892; font-size: 13px; }
    button { padding: 10px 18px; margin: 8px 12px 0 0; border: 1px solid #55534f; border-radius: 8px; background: #292a2d; color: inherit; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
  </style>
</head>
<body>
  <main aria-live="polite">
    <p class="muted">Futures-AI · 本地研究工作台</p>
    <h1 id="title">正在启动</h1>
    <p id="reason">正在准备本地后端，请稍候。</p>
    <p id="path" class="muted"></p>
    <p id="code" class="muted"></p>
    <p id="log-path" class="muted"></p>
    <div id="actions" hidden><button id="retry" type="button">重试</button><button id="logs" type="button">查看日志</button></div>
    <p id="action-result" class="muted"></p>
  </main>
  <script src="startup.js"></script>
</body>
</html>
