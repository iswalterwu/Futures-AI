<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Futures-AI</title>
    <!-- fai:critical:start -->
    <style>
      /* Generated by scripts/tokens-build.mjs from src/design/tokens.json. Do not edit. */
      :root {
        --fai-bg-top: #1B1C1F;
        --fai-bg-middle: #121315;
        --fai-bg-bottom: #0F1012;
        --fai-bg-angle: 180deg;
        --fai-bg-middle-stop: 55%;
        --fai-text-primary: #E8E6E0;
        --fai-text-secondary: #9A9892;
        --fai-status-fresh: #6CA7C7;
        --fai-font-serif: Georgia,"Times New Roman","Source Serif Pro","Songti SC",SimSun,serif;
        --fai-font-sans: "Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
        --fai-type-wordmark: 24px;
        --fai-type-body: 13px;
        --fai-type-body-lh: 1.5;
        --fai-type-loading: 13px;
        --fai-weight-strong: 700;
        --fai-space-grid-gap: 12px;
        --fai-space-content-pad-x: 26px;
        --fai-layout-viewport-height: 100vh;
      }

      html {
        color-scheme: dark;
        min-height: 100%;
        background: linear-gradient(var(--fai-bg-angle), var(--fai-bg-top), var(--fai-bg-middle) var(--fai-bg-middle-stop), var(--fai-bg-bottom));
        background-attachment: fixed;
        color: var(--fai-text-primary);
        font-family: var(--fai-font-sans);
        font-size: var(--fai-type-body);
        line-height: var(--fai-type-body-lh);
      }
      body {
        margin: 0;
      }
      #app {
        min-height: var(--fai-layout-viewport-height);
      }
      .fai-loading {
        box-sizing: border-box;
        min-height: var(--fai-layout-viewport-height);
        display: grid;
        place-content: center;
        gap: var(--fai-space-grid-gap);
        padding: var(--fai-space-content-pad-x);
        text-align: center;
      }
      .fai-loading > * {
        margin: 0;
      }
      .fai-loading .wordmark {
        font-family: var(--fai-font-serif);
        font-size: var(--fai-type-wordmark);
        font-weight: var(--fai-weight-strong);
      }
      .fai-loading .notice {
        color: var(--fai-text-secondary);
        font-size: var(--fai-type-loading);
      }
      .fai-loading progress {
        width: 100%;
        accent-color: var(--fai-status-fresh);
      }
    </style>
    <!-- fai:critical:end -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
